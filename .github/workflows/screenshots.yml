name: App Store screenshots

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Simulator name regex'
        default: 'iPhone [0-9]+ Pro Max'

jobs:
  shots:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.5.0.app

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Boot iPhone Pro Max simulator
        id: sim
        run: |
          xcrun simctl list devices available
          UDID=$(xcrun simctl list devices available | grep -E "${{ github.event.inputs.device || 'iPhone [0-9]+ Pro Max' }}" | tail -1 | grep -oE "[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}")
          echo "UDID=$UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Take screenshots
        continue-on-error: true
        env:
          FS_PHONE: ${{ secrets.FS_TEST_PHONE }}
          FS_PASSWORD: ${{ secrets.FS_TEST_PASSWORD }}
        run: |
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/screenshots_test.dart \
            -d "${{ steps.sim.outputs.udid }}" \
            --dart-define=FS_PHONE="$FS_PHONE" \
            --dart-define=FS_PASSWORD="$FS_PASSWORD"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fullseller-screenshots
          path: screenshots/0*.png
          if-no-files-found: warn
